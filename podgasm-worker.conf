[program:podgasm-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/penjualan-podgasm-main/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000 --memory=512
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/penjualan-podgasm-main/storage/logs/supervisor-worker.log
stopwaitsecs=3600
